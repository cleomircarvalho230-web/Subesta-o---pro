<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subestação PRO</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#24354f;font-family:Arial,sans-serif}.hero{background:linear-gradient(115deg,#173f95,#246bd0);color:white;padding:32px 20px 26px;border-radius:0 0 35px 35px}.hero small{letter-spacing:2px;opacity:.8}.hero h1{font-size:30px;margin:14px 0}.hero p{margin:0 0 15px}.author{font-size:13px;opacity:.9}.wrap{padding:20px 16px}.tabs{display:flex;gap:8px}.tabs button{flex:1;border:1px solid #dfe5ee;background:white;border-radius:20px;padding:17px 4px;color:#31445e;font-weight:bold;font-size:14px}.tabs button.active{background:#2462c7;color:white}.panel{background:white;border:1px solid #e4e8f0;border-radius:24px;padding:22px;margin-top:22px;min-height:260px;box-shadow:0 2px 10px #00000008}h2{margin:0 0 25px;font-size:23px}.empty{text-align:center;color:#718096;margin:65px 0}label{display:block;margin:14px 0 6px;font-weight:bold}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}textarea{min-height:85px}.primary{background:#2462c7;color:white;border:0;border-radius:12px;padding:13px 18px;font-weight:bold;margin-top:16px}.service{padding:15px;border:1px solid #dce3ec;border-radius:14px;margin:12px 0}.service h3{margin:0 0 8px}.service p{margin:6px 0;color:#64748b}.service select{margin-top:8px}.secondary{border:1px solid #cbd5e1;background:white;border-radius:10px;padding:10px;margin-top:12px}footer{text-align:center;font-size:12px;color:#7c8797;margin:30px 10px}</style></head><body><header class="hero"><small>PROTÓTIPO · VERSÃO 1</small><h1>⚡ Subestação PRO</h1><p>Gestão de serviços e etapas de manutenção</p><div class="author">Autor: Cleomir de Carvalho Pereira</div></header><main class="wrap"><nav class="tabs"><button id="newTab" onclick="show('new')">+ Novo serviço</button><button id="servicesTab" class="active" onclick="show('services')">Serviços</button><button id="sheetTab" onclick="show('sheet')">Planilha</button></nav><section class="panel" id="content"></section></main><footer>Subestação PRO · Cleomir de Carvalho Pereira</footer><script>const KEY='subestacao_pro_servicos_v1';let items=[];try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(items))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(tab){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById(({new:'newTab',services:'servicesTab',sheet:'sheetTab'})[tab]).classList.add('active');let c=document.getElementById('content');if(tab==='new'){c.innerHTML='<h2>Novo serviço</h2><form id="form"><label>Nome do serviço</label><input name="name" required placeholder="Ex.: Inspeção de disjuntor"><label>Subestação / local</label><input name="place" placeholder="Ex.: Pátio 69 kV"><label>Descrição / etapas</label><textarea name="notes" placeholder="Descreva as atividades"></textarea><label>Status</label><select name="status"><option>Iniciado</option><option>Em andamento</option><option>Concluído</option></select><button class="primary">Salvar serviço</button></form>';document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);items.push({id:Date.now(),name:f.get('name'),place:f.get('place'),notes:f.get('notes'),status:f.get('status'),date:new Date().toLocaleDateString('pt-BR')});save();show('services')};return}if(tab==='services'){c.innerHTML='<h2>Serviços registrados</h2>'+(items.length?items.map(x=>'<article class="service"><h3>'+esc(x.name)+'</h3><p>'+esc(x.place)+' · '+esc(x.date)+'</p><p>'+esc(x.notes)+'</p><label>Status</label><select onchange="statusChange('+x.id+',this.value)">'+['Iniciado','Em andamento','Concluído'].map(s=>'<option '+(x.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></article>').join(''):'<div class="empty">Nenhum serviço ainda.<br>Use “Novo serviço” para começar.</div>');return}c.innerHTML='<h2>Planilha de serviços</h2><p>'+items.length+' serviço(s) registrado(s).</p><button class="primary" onclick="downloadCSV()">Baixar planilha CSV</button><button class="secondary" onclick="downloadBackup()">Salvar cópia de segurança</button><label>Restaurar cópia de segurança</label><input type="file" accept=".json,application/json" onchange="restore(event)"><p style="font-size:13px;color:#64748b">Os serviços ficam salvos neste navegador. Faça cópias de segurança para não perder seus registros.</p>'}function statusChange(id,v){let x=items.find(a=>a.id===id);if(x){x.status=v;save()}}function dl(data,name,type){let u=URL.createObjectURL(new Blob([data],{type}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function downloadCSV(){let rows=[['Serviço','Local','Descrição','Status','Data'],...items.map(x=>[x.name,x.place,x.notes,x.status,x.date])];dl('\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),'subestacao-pro-planilha.csv','text/csv;charset=utf-8')}function downloadBackup(){dl(JSON.stringify(items,null,2),'subestacao-pro-backup.json','application/json')}function restore(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!Array.isArray(v))throw Error();if(confirm('Substituir os serviços atuais pelos da cópia?')){items=v;save();show('services')}}catch(e){alert('Arquivo de backup inválido')}};reader.readAsText(file)}show('services');</script></body></html>
